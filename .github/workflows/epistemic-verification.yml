name: Epistemic Interactive Solver

on:
  workflow_dispatch:
    inputs:
      variable_to_prune:
        description: 'Choose which variable status to globally broadcast'
        required: true
        default: 'robot_02_fail'
        type: choice
        options:
        - robot_02_fail
        - robot_01_fail
      boolean_state_value:
        description: 'Set the broadcasted state value (True or False)'
        required: true
        default: 'False'
        type: choice
        options:
        - 'False'
        - 'True'

jobs:
  interactive-run:
    runs-on: ubuntu-latest

    steps:
    - name: Download Repository Files
      uses: actions/checkout@v4

    - name: Setup System Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Load Logic Graph Core
      run: |
        python -m pip install --upgrade pip
        pip install networkx

    - name: Run Existing Script with Custom Input Override
      shell: python
      run: |
        import sys
        # Point Python to your specific folder path
        sys.path.append('Epistemic_Logic_Engine')

        var_to_prune = "${{ github.event.inputs.variable_to_prune }}"
        val_to_prune = ${{ github.event.inputs.boolean_state_value }}

        import epistemic_engine as ee
        
        engine = ee.KripkeWorldModel()
        engine.add_world('W_00', {'robot_01_fail': False, 'robot_02_fail': False})
        engine.add_world('W_10', {'robot_01_fail': True,  'robot_02_fail': False}, is_actual=True)
        engine.add_world('W_01', {'robot_01_fail': False, 'robot_02_fail': True})
        engine.add_world('W_11', {'robot_01_fail': True,  'robot_02_fail': True})
        
        engine.add_uncertainty('W_00', 'W_10', 'robot_01')
        engine.add_uncertainty('W_01', 'W_11', 'robot_01')
        engine.add_uncertainty('W_00', 'W_01', 'robot_02')
        engine.add_uncertainty('W_10', 'W_11', 'robot_02')
        
        print('🤖 [E.L.B.E.R.R. Core Logic Engine Online]')
        print(f'📥 INPUT RECEIVED -> Broadcast: {var_to_prune} is {val_to_prune}')
        
        engine.public_announcement(var_to_prune, val_to_prune)
        
        actual = engine.actual_world
        print('\n🖥️ --- ENGINE THOUGHT REASONING STATUS ---')
        print(f'Does robot_01 know its own status? -> {engine.agent_knows("robot_01", "robot_01_fail", actual, depth=1)}')
        print(f'Level 2 Recursive Check: Does robot_01 know that robot_02 knows about its fault? -> {engine.agent_knows("robot_01", "robot_01_fail", actual, depth=2)}')
