name: Epistemic Solver CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-logic:
    runs-on: ubuntu-latest

    steps:
    - name: Download Repository Files
      uses: actions/checkout@v4

    - name: Setup System Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Load Logic Graph Core
      run: |
        python -m pip install --upgrade pip
        pip install networkx

    - name: Check Epistemic Logic Engine Stability
      run: |
        python Epistemic_Logic_Engine/epistemic_engine.py
